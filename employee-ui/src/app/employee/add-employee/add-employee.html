<div class="container mt-5">

  <div class="card shadow p-4">

    <h3 class="mb-4">

      Add Employee

    </h3>

    <form
      [formGroup]="employeeForm"
      (ngSubmit)="onSubmit()">

      <div class="row">

        <!-- EMPLOYEE CODE -->

        <div class="col-md-6 mb-3">

          <label class="form-label">

            Employee Code

          </label>

          <input
            type="text"
            class="form-control"
            formControlName="employeeCode">

        </div>

        <!-- NAME -->

        <div class="col-md-6 mb-3">

          <label class="form-label">

            Name

          </label>

          <input
            type="text"
            class="form-control"
            formControlName="name">

        </div>

        <!-- EMAIL -->

        <div class="col-md-6 mb-3">

          <label class="form-label">

            Email

          </label>

          <input
            type="email"
            class="form-control"
            formControlName="email">

        </div>

        <!-- DEPARTMENT -->

        <div class="col-md-6 mb-3">

          <label class="form-label">

            Department

          </label>

          <input
            type="text"
            class="form-control"
            formControlName="department">

        </div>

        <!-- SALARY -->

        <div class="col-md-6 mb-3">

          <label class="form-label">

            Salary

          </label>

          <input
            type="number"
            class="form-control"
            formControlName="salary">

        </div>

        <!-- JOINING DATE -->

        <div class="col-md-6 mb-3">

          <label class="form-label">

            Joining Date

          </label>

          <input
            type="date"
            class="form-control"
            formControlName="joiningDate">

        </div>

      </div>

      <button
        type="submit"
        class="btn btn-success">

        Save Employee

      </button>

    </form>

  </div>

</div>
