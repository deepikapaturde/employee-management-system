<div class="container mt-5">

  <div class="card p-4 shadow">

    <h3 class="mb-4">
      User Registration
    </h3>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()">

      <!-- NAME -->

      <div class="mb-3">

        <label>
          Name
        </label>

        <input
          type="text"
          class="form-control"
          formControlName="name">

      </div>

      <!-- EMAIL -->

      <div class="mb-3">

        <label>
          Email
        </label>

        <input
          type="email"
          class="form-control"
          formControlName="email">

      </div>

      <!-- PASSWORD -->

      <div class="mb-3">

        <label>
          Password
        </label>

        <input
          type="password"
          class="form-control"
          formControlName="password">

      </div>

      <!-- ROLE -->

      <div class="mb-3">

        <label>
          Role
        </label>

        <select
          class="form-control"
          formControlName="role">

          <option value="">
            Select Role
          </option>

          <option value="ADMIN">
            ADMIN
          </option>

          <option value="HR">
            HR
          </option>

           <option value="MANAGER">
            MANAGER
          </option>

          <option value="EMPLOYEE">
            EMPLOYEE
          </option>

        </select>

      </div>

      <button
        class="btn btn-primary w-100">

        Register

      </button>

    </form>

    <div
      *ngIf="errorMessage"
      class="text-danger mt-3">

      {{ errorMessage }}

    </div>

  </div>

</div>
