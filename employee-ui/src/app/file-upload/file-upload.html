<div class="container mt-5">

  <h3>File Upload</h3>

  <input
    type="file"
    class="form-control mb-3"
    (change)="onFileSelected($event)"
  >

  <button
    class="btn btn-primary"
    (click)="upload()">

    Upload File

  </button>

  <p class="mt-3 text-success">

    {{ message }}

  </p>

</div>
